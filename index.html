<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be My Girlfriend?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: one centred love-letter card on a blush background with drifting hearts; bunny on top, question, two buttons. One sweet pink look on purpose. */
:root {
  color-scheme: light;
  --bg: #ffe4ec;
  --bg2: #ffd1e0;
  --card: #fffafc;
  --ink: #5a2a43;
  --ink-soft: #9a6880;
  --pink: #ff6f9c;
  --pink-dark: #e04a7c;
  --rose: #ffb3cb;
  --lilac: #c9b6ff;
  --font-display: "Mochiy Pop One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Quicksand", "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(circle at 20% 10%, var(--bg2), transparent 45%),
              radial-gradient(circle at 85% 90%, #f3e1ff, transparent 45%), var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.float-heart { position: absolute; bottom: -40px; animation: rise linear forwards; opacity: .75; }
@keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

.card {
  position: relative; z-index: 1;
  width: min(100%, 400px);
  background: var(--card);
  border-radius: 32px;
  padding: 26px 22px 28px;
  box-shadow: 0 18px 40px rgba(224, 74, 124, .22), 0 0 0 6px rgba(255,255,255,.7);
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.card::before, .card::after {
  content: "♥"; position: absolute; color: var(--rose); font-size: 1.4rem;
}
.card::before { top: 14px; left: 18px; transform: rotate(-18deg); }
.card::after { top: 14px; right: 18px; transform: rotate(18deg); }

.bunny { width: 170px; height: 170px; }
.bunny .float { animation: bob 2.4s ease-in-out infinite; transform-origin: center; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.face { display: none; }
.bunny[data-mood="shy"] .f-shy,
.bunny[data-mood="sad"] .f-sad,
.bunny[data-mood="happy"] .f-happy { display: inline; }
.tears { display: none; }
.bunny[data-mood="sad"] .tears { display: inline; }

h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(1.55rem, 7vw, 1.9rem); line-height: 1.3; margin: 0;
  color: var(--pink-dark); text-wrap: balance;
}
.sub { margin: -4px 0 0; font-weight: 600; color: var(--ink-soft); font-size: 1.02rem; min-height: 1.5em; }
.sub.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.buttons { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 64px; margin-top: 4px; }
.btn {
  font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .02em;
  border: 0; border-radius: 999px; padding: 13px 30px; cursor: pointer;
  transition: transform .15s, box-shadow .15s, background .2s;
  touch-action: manipulation;
}
.btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.yes { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-dark); }
.yes:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
.yes.confirm { background: #ff4d7e; animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 6px 0 var(--pink-dark), 0 0 0 10px rgba(255,111,156,.2); } }
.no { background: #fff; color: var(--ink-soft); box-shadow: 0 6px 0 #ecd3dd; border: 2px solid #f2dbe4; }
.no.flying { position: fixed; z-index: 5; transition: left .35s cubic-bezier(.3,1.4,.5,1), top .35s cubic-bezier(.3,1.4,.5,1); }
.no.turned { background: var(--pink); color: #fff; border-color: transparent; box-shadow: 0 6px 0 var(--pink-dark); animation: pop .4s; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } }

.giggle { font-family: var(--font-display); color: var(--pink-dark); font-size: 1.4rem; margin: 0; animation: pop .45s; }

.result h1 { font-size: clamp(1.45rem, 6.6vw, 1.75rem); }
.love {
  font-family: var(--font-display); font-size: clamp(2rem, 10vw, 2.6rem); color: var(--pink);
  margin: 0; animation: beat 1s ease-in-out infinite;
}
@keyframes beat { 15%, 45% { transform: scale(1.12); } 30% { transform: scale(1); } }
.stamp {
  margin: 4px 0 0; font-size: .85rem; font-weight: 700; color: var(--ink-soft);
  border: 2px dashed var(--rose); border-radius: 12px; padding: 6px 12px;
}
.stamp b { color: var(--pink-dark); }

@media (prefers-reduced-motion: reduce) {
  .bunny .float, .love, .yes.confirm, .float-heart, .sub.shake, .giggle, .no.turned { animation: none; }
}
</style>
</head>
<body>

<div id="hearts" aria-hidden="true"></div>

<main class="card" id="card">
  <svg class="bunny" id="bunny" data-mood="shy" viewBox="0 0 200 200" role="img" aria-label="A cute bunny holding a heart">
    <g class="float">
      <!-- ears -->
      <ellipse cx="72" cy="48" rx="17" ry="40" fill="#ffffff" stroke="#f3c6d6" stroke-width="3" transform="rotate(-10 72 48)"/>
      <ellipse cx="72" cy="52" rx="8" ry="28" fill="#ffc2d6" transform="rotate(-10 72 52)"/>
      <ellipse cx="128" cy="48" rx="17" ry="40" fill="#ffffff" stroke="#f3c6d6" stroke-width="3" transform="rotate(10 128 48)"/>
      <ellipse cx="128" cy="52" rx="8" ry="28" fill="#ffc2d6" transform="rotate(10 128 52)"/>
      <!-- bow -->
      <path d="M118 30 l-14 -9 v18 z M118 30 l14 -9 v18 z" fill="#ff6f9c"/>
      <circle cx="118" cy="30" r="5" fill="#e04a7c"/>
      <!-- head -->
      <ellipse cx="100" cy="112" rx="62" ry="54" fill="#ffffff" stroke="#f3c6d6" stroke-width="3"/>
      <!-- cheeks -->
      <ellipse cx="62" cy="126" rx="12" ry="8" fill="#ffb3cb" opacity=".8"/>
      <ellipse cx="138" cy="126" rx="12" ry="8" fill="#ffb3cb" opacity=".8"/>
      <!-- shy face -->
      <g class="face f-shy">
        <path d="M68 108 q8 -8 16 0" stroke="#5a2a43" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M116 108 q8 -8 16 0" stroke="#5a2a43" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M92 124 q8 8 16 0" stroke="#5a2a43" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- sad face -->
      <g class="face f-sad">
        <circle cx="76" cy="108" r="8" fill="#5a2a43"/><circle cx="79" cy="105" r="3" fill="#fff"/>
        <circle cx="124" cy="108" r="8" fill="#5a2a43"/><circle cx="127" cy="105" r="3" fill="#fff"/>
        <path d="M66 98 l14 -6 M134 98 l-14 -6" stroke="#5a2a43" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M92 132 q8 -8 16 0" stroke="#5a2a43" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <g class="tears">
        <path d="M72 120 q-4 10 0 14 q4 -4 0 -14z" fill="#8fd3ff"/>
        <path d="M128 120 q-4 10 0 14 q4 -4 0 -14z" fill="#8fd3ff"/>
      </g>
      <!-- happy face -->
      <g class="face f-happy">
        <path d="M66 110 l10 -8 l10 8" stroke="#5a2a43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M114 110 l10 -8 l10 8" stroke="#5a2a43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M88 122 q12 16 24 0 z" fill="#e04a7c" stroke="#5a2a43" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <!-- paws + heart -->
      <path d="M100 196 c-26 -16 -40 -28 -40 -42 c0 -10 8 -16 16 -16 c10 0 18 8 24 16 c6 -8 14 -16 24 -16 c8 0 16 6 16 16 c0 14 -14 26 -40 42z" fill="#ff6f9c" stroke="#e04a7c" stroke-width="3"/>
      <ellipse cx="66" cy="160" rx="13" ry="10" fill="#ffffff" stroke="#f3c6d6" stroke-width="3"/>
      <ellipse cx="134" cy="160" rx="13" ry="10" fill="#ffffff" stroke="#f3c6d6" stroke-width="3"/>
    </g>
  </svg>

  <!-- Step 1: question -->
  <section id="ask" class="card-inner" style="display:flex;flex-direction:column;gap:14px;align-items:center">
    <h1 id="question">Will you be my girlfriend? 💕</h1>
    <p class="sub" id="sub">Choose carefully ya~ 🙈</p>
    <div class="buttons" id="buttons">
      <button class="btn yes" id="yes" type="button">Yes 💖</button>
      <button class="btn no" id="no" type="button">No</button>
    </div>
  </section>

  <!-- Step 2: giggle -->
  <p class="giggle" id="giggle" hidden>No regrets okay? Hehehe 🙈</p>

  <!-- Step 3: result -->
  <section class="result" id="result" hidden style="flex-direction:column;gap:12px;align-items:center">
    <h1>Congratulations! 🎉<br>You got a new boyfriend!</h1>
    <p class="love">Love you! 💗</p>
    <p class="stamp">Status: <b>Officially taken</b> 💍</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const bunny = $("bunny"), yes = $("yes"), no = $("no"), sub = $("sub");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const teases = [
  "Huh? Are you sure? 🥺",
  "Think again lah~ 😢",
  "My heart is cracking… 💔",
  "Last chance to choose correctly 😤",
  "The No button is getting tired… 😮‍💨"
];
let noCount = 0, stage = "ask";

function setSub(text) {
  sub.textContent = text;
  sub.classList.remove("shake"); void sub.offsetWidth; sub.classList.add("shake");
}

function moveNo() {
  const pad = 16;
  const r = no.getBoundingClientRect();
  if (!no.classList.contains("flying")) {
    // pin it where it is, then let it fly
    no.style.left = r.left + "px"; no.style.top = r.top + "px";
    no.classList.add("flying");
    void no.offsetWidth;
  }
  const yr = yes.getBoundingClientRect();
  const maxX = window.innerWidth - r.width - pad, maxY = window.innerHeight - r.height - pad;
  let x, y, tries = 0;
  do {
    x = pad + Math.random() * Math.max(0, maxX - pad);
    y = pad + Math.random() * Math.max(0, maxY - pad);
    tries++;
  } while (tries < 30 && (
    (x < yr.right + 20 && x + r.width > yr.left - 20 && y < yr.bottom + 20 && y + r.height > yr.top - 20) ||
    Math.hypot(x - r.left, y - r.top) < 90
  ));
  no.style.left = x + "px"; no.style.top = y + "px";
}

function turnNoIntoYes() {
  no.classList.remove("flying"); no.style.left = ""; no.style.top = "";
  no.classList.add("turned");
  no.textContent = "Yes 💖";
  no.dataset.turned = "1";
  yes.style.transform = "";
  bunny.dataset.mood = "shy";
  setSub("Hehe, now there's only YES 😚");
}

no.addEventListener("click", () => {
  if (no.dataset.turned) { pressYes(); return; }
  noCount++;
  if (noCount <= 5) {
    bunny.dataset.mood = "sad";
    setSub(teases[noCount - 1]);
    yes.style.transform = `scale(${1 + noCount * 0.08})`;
    moveNo();
  } else {
    turnNoIntoYes();
  }
});

function pressYes() {
  if (stage === "ask") {
    stage = "confirm";
    bunny.dataset.mood = "happy";
    yes.style.transform = "";
    no.hidden = true;
    yes.textContent = "Confirm? 💍";
    yes.classList.add("confirm");
    setSub("Really really? 🥹");
    return;
  }
  if (stage === "confirm") {
    stage = "giggle";
    $("ask").hidden = true; $("ask").style.display = "none";
    no.hidden = true;
    $("giggle").hidden = false;
    burst(18);
    setTimeout(showResult, 1900);
  }
}
yes.addEventListener("click", pressYes);

function showResult() {
  stage = "done";
  $("giggle").hidden = true;
  const r = $("result"); r.hidden = false; r.style.display = "flex";
  bunny.dataset.mood = "happy";
  burst(60);
  if (!reduceMotion) setInterval(() => burst(4), 900);
}

// floating hearts
const heartsBox = $("hearts");
const glyphs = ["💗", "💕", "💖", "🩷", "♥"];
function heart(fromBottomOnly) {
  const h = document.createElement("span");
  h.className = "float-heart";
  h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 14 + Math.random() * 22 + "px";
  h.style.color = Math.random() > .5 ? "#ff6f9c" : "#ffb3cb";
  h.style.animationDuration = 5 + Math.random() * 5 + "s";
  heartsBox.appendChild(h);
  h.addEventListener("animationend", () => h.remove());
}
function burst(n) { if (reduceMotion) return; for (let i = 0; i < n; i++) setTimeout(heart, i * 40); }
if (!reduceMotion) { burst(8); setInterval(() => heart(), 1400); }
window.addEventListener("resize", () => { if (no.classList.contains("flying")) moveNo(); });
</script>
</body>
</html>
